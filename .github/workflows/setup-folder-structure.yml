name: Restructure - Remove Version Folders

on:
  workflow_dispatch:

jobs:
  restructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove version subfolders and keep only module folders
        run: |
          # ServiceNow
          rm -rf servicenow-integration/v1.0
          rm -rf servicenow-integration/v2.0

          # CyberArk
          rm -rf cyberark-integration/v1.0
          rm -rf cyberark-integration/v2.0

          # Windows Automation
          rm -rf windows-automation/v1.0
          rm -rf windows-automation/v2.0

          # Linux Automation
          rm -rf linux-automation/v1.0
          rm -rf linux-automation/v2.0

          # AWX Tower
          rm -rf awx-tower-deployment/v1.0
          rm -rf awx-tower-deployment/v2.0

      - name: Commit and push changes
        run: |
          git add .
          git diff --cached --quiet || git commit -m "chore: remove version subfolders - files now directly in module folders"
          git push origin dev
