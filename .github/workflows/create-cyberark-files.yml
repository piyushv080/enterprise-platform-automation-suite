name: Create CyberArk Integration Files

on:
  workflow_dispatch:

jobs:
  create-cyberark-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create folder structure
        run: |
          mkdir -p cyberark-integration/ansible-playbooks
          mkdir -p cyberark-integration/powershell

      - name: Create add-cyberark-account.yml
        run: |
          cat > cyberark-integration/ansible-playbooks/add-cyberark-account.yml << 'EOF'
          ---
          - name: Add CyberArk Account
            hosts: localhost
            tasks:

              - name: Get domain name
                command: hostname -d
                register: domain_name

              - name: Get hostname
                command: hostname
                register: host_name

              - name: Set variables
                set_fact:
                  base_uri: "cyberark.yourdomain.com"
                  app_id: "YourAppID"
                  aim_safe: "Your-AIM-Safe-Name"
                  aim_username: "YourAIMUser"
                  aim_authentication_uri: "https://{{ base_uri }}/AIMWebService/api/Accounts?AppID={{ app_id }}&Safe={{ aim_safe }}&Username={{ aim_username }}"
                  rest_authentication_uri: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"

              - name: Log base URI
                debug:
                  msg: "CyberArk Base URI: {{ base_uri }}"

              - name: Get AIM authentication token
                uri:
                  url: "{{ aim_authentication_uri }}"
                  method: GET
                  return_content: yes
                register: aim_token
                failed_when: aim_token.status != 200
                retries: 3
                delay: 5
                until: aim_token.status == 200

              - name: Log AIM token retrieval
                debug:
                  msg: "Retrieved AIM credential"

              - name: Build authentication body
                set_fact:
                  authentication_body: |
                    {
                      "username": "{{ aim_username }}",
                      "password": "{{ aim_token.content }}"
                    }

              - name: Log into CyberArk
                uri:
                  url: "{{ rest_authentication_uri }}"
                  method: POST
                  body: "{{ authentication_body }}"
                  headers:
                    Content-Type: "application/json"
                  return_content: yes
                register: rest_token
                failed_when: rest_token.status != 200
                retries: 3
                delay: 5
                until: rest_token.status == 200

              - name: Log CyberArk login
                debug:
                  msg: "Logged into CyberArk"

              - name: Set authentication header
                set_fact:
                  authentication_header: "Authorization: {{ rest_token.json.CyberArkLogonResult | join(' ') }}"

              - name: Map domain name for CyberArk vault
                set_fact:
                  acr: >
                    {% if domain_name.stdout == 'yourdomain.local' %} ORG
                    {% elif domain_name.stdout == 'example.com' %} EXAMPLE
                    {% elif domain_name.stdout == 'dev.example.com' %} DEV
                    {% elif domain_name.stdout == 'corp.lab.local' %} LAB
                    {% else %} UNKNOWN
                    {% endif %}

              - name: Set CyberArk parameters
                set_fact:
                  safe_name: "ORG-P-SERV-WIN-{{ acr }}"
                  platform_id: "Windows-Local-{{ acr }}-OTU"
                  account_address: "{{ host_name.stdout }}.{{ domain_name.stdout }}"
                  account_name: "OS-{{ platform_id }}-{{ account_address }}-localadmin"

              - name: Log CyberArk parameters
                debug:
                  msg:
                    - "Safe Name: {{ safe_name }}"
                    - "Platform ID: {{ platform_id }}"
                    - "Account Address: {{ account_address }}"
                    - "Account Name: {{ account_name }}"

              - name: Build account body
                set_fact:
                  new_account_body: |
                    {
                      "account" : {
                        "safe": "{{ safe_name }}",
                        "platformID": "{{ platform_id }}",
                        "address": "{{ account_address }}",
                        "password": "DefaultPasswordHere",
                        "accountName": "{{ account_name }}",
                        "username": "localadmin",
                        "properties": [
                          {"Key": "ResetImmediately", "Value": "ChangeTask"}
                        ]
                      }
                    }

              - name: Add account to CyberArk
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Account"
                  method: POST
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  body: "{{ new_account_body }}"
                  return_content: yes
                register: new_account_results
                failed_when: new_account_results.status != 200
                retries: 3
                delay: 5
                until: new_account_results.status == 200

              - name: Log account creation
                debug:
                  msg: "Account added to CyberArk"

              - name: Query account in CyberArk
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Accounts?Keywords={{ account_address }},localadmin&Safe={{ safe_name }}"
                  method: GET
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: account_details
                failed_when: account_details.status != 200
                retries: 3
                delay: 5
                until: account_details.status == 200

              - name: Check account ID
                set_fact:
                  account_id: "{{ account_details.json.accounts[0].AccountID | default('') }}"

              - name: Log account ID
                debug:
                  msg: >
                    {% if account_id %}
                      Account ID found: {{ account_id }}
                    {% else %}
                      Account not found
                    {% endif %}

              - name: Log out of CyberArk
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logoff"
                  method: POST
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: logoff_results
                failed_when: logoff_results.status != 200

              - name: Log CyberArk logoff
                debug:
                  msg: "Logged out of CyberArk"
          EOF

      - name: Create get-cyberark-account.yml
        run: |
          cat > cyberark-integration/ansible-playbooks/get-cyberark-account.yml << 'EOF'
          ---
          - name: Get CyberArk Account
            hosts: localhost

            vars:
              base_uri: "cyberark.yourcompany.com"
              app_id: "YourAppID"
              aim_safe: "YourAIMSafe"
              aim_username: "YourAIMUser"
              aim_authentication_uri: "https://{{ base_uri }}/AIMWebService/api/Accounts?AppID={{ app_id }}&Safe={{ aim_safe }}&Username={{ aim_username }}"
              rest_authentication_uri: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"

            tasks:

              - name: Get AIM authentication token
                uri:
                  url: "{{ aim_authentication_uri }}"
                  method: GET
                  return_content: yes
                register: aim_token
                failed_when: aim_token.status != 200
                retries: 3
                delay: 5
                until: aim_token.status == 200

              - name: Build authentication body
                set_fact:
                  authentication_body: |
                    {
                      "username": "{{ aim_username }}",
                      "password": "{{ aim_token.content }}"
                    }

              - name: Log into CyberArk
                uri:
                  url: "{{ rest_authentication_uri }}"
                  method: POST
                  body: "{{ authentication_body }}"
                  headers:
                    Content-Type: "application/json"
                  return_content: yes
                register: rest_token
                failed_when: rest_token.status != 200
                retries: 3
                delay: 5
                until: rest_token.status == 200

              - name: Set authentication header
                set_fact:
                  authentication_header: "Authorization: {{ rest_token.json.CyberArkLogonResult | join(' ') }}"

              - name: Search for the account
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Accounts?Keywords={{ server }},{{ username }}"
                  method: GET
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: account_details
                failed_when: account_details.status != 200
                retries: 3
                delay: 5
                until: account_details.status == 200

              - name: Check account ID
                set_fact:
                  account_id: "{{ account_details.json.accounts[0].AccountID | default('') }}"
                  account_properties: "{{ account_details.json.accounts[0].Properties }}"

              - name: Split hostname and domain
                set_fact:
                  hostname: "{{ server.split('.')[0] }}"
                  domain: "{{ server.split('.')[1:] | join('.') }}"

              - name: Map domain name for CyberArk vault
                set_fact:
                  acr: >
                    {% if domain == 'yourdomain.local' %} ORG
                    {% elif domain == 'example.com' %} EXAMPLE
                    {% elif domain == 'dev.example.com' %} DEV
                    {% elif domain == 'lab.internal' %} LAB
                    {% else %} UNKNOWN
                    {% endif %}

              - name: Set PlatformID
                set_fact:
                  platform_id: "Windows-Local-{{ acr }}-NR"

              - name: Extract account safe name
                set_fact:
                  account_safe: "{{ item.Value }}"
                loop: "{{ account_properties }}"
                when: item.Key == "Safe"

              - name: Update account in CyberArk
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Accounts/{{ account_id }}"
                  method: PUT
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: account_update
                failed_when: account_update.status != 200

              - name: Get account password
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Accounts/{{ account_id }}/Credentials"
                  method: GET
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: account_password
                failed_when: account_password.status != 200

              - name: Convert password
                set_fact:
                  cred_password: "{{ account_password.content | b64decode }}"

              - name: Log out of CyberArk
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logoff"
                  method: POST
                  headers:
                    Authorization: "{{ authentication_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: logoff_results
                failed_when: logoff_results.status != 200
          EOF

      - name: Create get-domain-by-server.yml
        run: |
          cat > cyberark-integration/ansible-playbooks/get-domain-by-server.yml << 'EOF'
          ---
          - name: Retrieve Domain Name by Server Name
            hosts: localhost
            gather_facts: no

            vars_prompt:
              - name: "server_name"
                prompt: "Enter the server name"
                private: no

            tasks:

              - name: Perform DNS lookup
                command: nslookup {{ server_name }}
                register: nslookup_result
                changed_when: false

              - name: Extract domain name from nslookup output
                set_fact:
                  domain_name: >-
                    {{ nslookup_result.stdout
                       | regex_search('Name:\\s*(.*)', '\\1')
                       | default('UNKNOWN', true)
                    }}

              - name: Show extracted domain name
                debug:
                  msg: "The domain name for server {{ server_name }} is: {{ domain_name }}"
          EOF

      - name: Create add-local-admin-cyberark.yml
        run: |
          cat > cyberark-integration/ansible-playbooks/add-local-admin-cyberark.yml << 'EOF'
          ---
          - name: Add local admin account to CyberArk
            hosts: localhost
            gather_facts: no

            vars:
              domain: "{{ ansible_domain }}"
              username: "localadmin"
              hostname: "{{ ansible_hostname }}"
              base_uri: "cyberark.yourcompany.com"
              app_id: "YourAppID"
              aim_safe: "YourAIMSafeName"
              aim_username: "YourAIMServiceAccount"
              aim_auth_uri: "https://{{ base_uri }}/AIMWebService/api/Accounts?AppID={{ app_id }}&Safe={{ aim_safe }}&Username={{ aim_username }}"
              rest_auth_uri: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"
              new_account_uri: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Account"
              release_token_uri: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logoff"

            tasks:

              - name: Get AIM authentication token
                uri:
                  url: "{{ aim_auth_uri }}"
                  method: GET
                  return_content: yes
                register: aim_token_response
                failed_when: aim_token_response.status != 200

              - name: Log into CyberArk
                uri:
                  url: "{{ rest_auth_uri }}"
                  method: POST
                  body_format: json
                  body:
                    username: "{{ aim_username }}"
                    password: "{{ aim_token_response.content }}"
                  headers:
                    Content-Type: "application/json"
                  return_content: yes
                register: rest_token_response
                failed_when: rest_token_response.status != 200

              - name: Set authentication header
                set_fact:
                  auth_header: "Authorization: {{ rest_token_response.json.CyberArkLogonResult }}"

              - name: Map domain to acronym
                set_fact:
                  acr: "{{ domain_map[domain] }}"
                vars:
                  domain_map:
                    yourdomain.local: "ORG"
                    example.com: "EXAMPLE"
                    dev.example.com: "DEV"
                    lab.internal: "LAB"

              - name: Build account details
                set_fact:
                  safe_name: "ORG-P-SERV-WIN-{{ acr }}"
                  platform_id: "Windows-Local-{{ acr }}-OTU"
                  account_address: "{{ hostname }}.{{ domain }}"
                  account_name: "Operating System-{{ platform_id }}-{{ account_address }}-{{ username }}"

              - name: Add account to CyberArk
                uri:
                  url: "{{ new_account_uri }}"
                  method: POST
                  headers:
                    Authorization: "{{ auth_header }}"
                    Content-Type: "application/json"
                  body_format: json
                  return_content: yes
                register: new_account_response
                failed_when: new_account_response.status != 200

              - name: Query account to confirm addition
                uri:
                  url: "https://{{ base_uri }}/PasswordVault/WebServices/PIMServices.svc/Accounts?Keywords={{ account_address }},{{ username }}&Safe={{ safe_name }}"
                  method: GET
                  headers:
                    Authorization: "{{ auth_header }}"
                    Content-Type: "application/json"
                  return_content: yes
                register: query_account_response
                failed_when: query_account_response.status != 200

              - name: Check if account ID exists
                set_fact:
                  account_id: "{{ query_account_response.json.accounts[0].AccountID }}"
                when: query_account_response.json.accounts | length > 0

              - name: Log account ID status
                debug:
                  msg: "The Account ID was found: {{ account_id }}"
                when: account_id is defined

              - name: Log account not found
                debug:
                  msg: "The account could not be found"
                when: account_id is not defined

              - name: Log out of CyberArk
                uri:
                  url: "{{ release_token_uri }}"
                  method: POST
                  headers:
                    Authorization: "{{ auth_header }}"
                    Content-Type: "application/json"
                  return_content: yes
          EOF

      - name: Create cyberark-login-logout.yml
        run: |
          cat > cyberark-integration/ansible-playbooks/cyberark-login-logout.yml << 'EOF'
          ---
          - name: Login and Logout of CyberArk with Logging
            hosts: localhost
            gather_facts: no

            vars:
              base_uri: "cyberark.yourcompany.com"
              app_id: "YourAppID"
              aim_safe: "YourAIMSafe"
              aim_username: "YourAIMServiceAccount"
              aim_auth_uri: "https://{{ base_uri }}/AIMWebService/api/Accounts?AppID={{ app_id }}&Safe={{ aim_safe }}&Username={{ aim_username }}"
              rest_auth_uri: "https://{{ base_uri }}/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"
              release_token_uri: "https://{{ base_uri }}/PasswordVault/API/Auth/Logoff/"

            tasks:

              - name: Get AIM authentication token
                uri:
                  url: "{{ aim_auth_uri }}"
                  method: GET
                  return_content: yes
                  validate_certs: no
                register: aim_token_response
                failed_when: aim_token_response.status != 200

              - name: Log AIM authentication token response
                debug:
                  msg:
                    - "AIM Token Response: {{ aim_token_response.content }}"
                    - "Status Code: {{ aim_token_response.status }}"

              - name: Extract AIM token
                set_fact:
                  aim_token: "{{ aim_token_response.json | json_query('Content') }}"

              - name: Log into CyberArk
                uri:
                  url: "{{ rest_auth_uri }}"
                  method: POST
                  body_format: json
                  body:
                    username: "{{ aim_username }}"
                    password: "{{ aim_token }}"
                  headers:
                    Content-Type: "application/json"
                  return_content: yes
                  validate_certs: no
                register: rest_token_response
                failed_when: rest_token_response.status != 200

              - name: Log CyberArk login response
                debug:
                  msg:
                    - "CyberArk Login Response: {{ rest_token_response.json }}"
                    - "Status Code: {{ rest_token_response.status }}"

              - name: Set authentication header
                set_fact:
                  auth_header: "{{ rest_token_response.json.CyberArkLogonResult }}"

              - name: Log out of CyberArk
                uri:
                  url: "{{ release_token_uri }}"
                  method: POST
                  headers:
                    Content-Type: "application/json"
                    Authorization: "{{ auth_header }}"
                  return_content: yes
                  validate_certs: no
                register: logout_response
                failed_when: logout_response.status != 200

              - name: Log CyberArk logout response
                debug:
                  msg:
                    - "CyberArk Logout Response: {{ logout_response.json }}"
                    - "Status Code: {{ logout_response.status }}"
          EOF

      - name: Create cyberark-functions.ps1
        run: |
          cat > cyberark-integration/powershell/cyberark-functions.ps1 << 'EOF'
          function Add-CyberArkAccount {

              param (
                  [string]$domain = (Get-WmiObject Win32_ComputerSystem).Domain,
                  [string]$username = "localadmin",
                  [string]$hostname = $ENV:COMPUTERNAME
              )

              Write-Log "Adding local admin account/password into CyberArk vault"
              Write-Log "username: $username | hostname: $hostname | domain: $domain"

              $BaseURI     = "cyberark.yourcompany.com"
              $AppID       = "YourAppID"
              $AIMSafe     = "YourAIMSafeName"
              $AIMUsername = "YourServiceAccount"

              $AIMAuthenticationURI = "https://$BaseURI/AIMWebService/api/Accounts?AppID=$AppID&Safe=$AIMSafe&Username=$AIMUsername"

              Try {
                  $AIMToken = Invoke-RestMethod -Method GET -Uri $AIMAuthenticationURI -ErrorAction Stop
                  Write-Log "Successfully retrieved AIM credential"
              }
              Catch { Write-Log "ERROR: Unable to retrieve AIM Credential" }

              $RESTAuthenticationURI = "https://$BaseURI/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"
              $AuthenticationBody = '{"username":"' + $AIMUsername + '","password":"' + $AIMToken.Content + '"}'

              Try {
                  $RESTToken = Invoke-RestMethod -Method POST -Uri $RESTAuthenticationURI -Body $AuthenticationBody -ContentType "application/json" -ErrorAction Stop
                  Write-Log "Successfully logged in to CyberArk"
              }
              Catch { Write-Log "ERROR: Unable to log in to CyberArk" }

              $AuthenticationHeader = @{ "Authorization" = ($RESTToken.CyberArkLogonResult -join " ") }

              switch ($domain) {
                  "example.local"    { $acr = 'EXAMPLE' }
                  "corp.example.com" { $acr = 'CORP' }
                  "dev.example.com"  { $acr = 'DEV' }
                  "lab.internal"     { $acr = 'LAB' }
                  Default            { $acr = 'UNKNOWN' }
              }

              $safeName       = "ORG-P-SERV-WIN-$acr"
              $platformID     = "Windows-Local-$acr-OTU"
              $accountAddress = "$hostname.$domain"
              $accountName    = "Operating System-$platformID-$accountAddress-$username"

              $NewAccountBody = '{
                  "account" : {
                      "safe":"' + $safeName + '",
                      "platformID":"' + $platformID + '",
                      "address":"' + $accountAddress + '",
                      "password":"DefaultPasswordHere",
                      "accountName":"' + $accountName + '",
                      "username":"' + $username + '",
                      "properties": [{"Key":"ResetImmediately","Value":"ChangeTask"}]
                  }
              }'

              $NewAccountCreationURI = "https://$BaseURI/PasswordVault/WebServices/PIMServices.svc/Account"

              Try {
                  $NewAccountResults = Invoke-RestMethod -Method POST -Headers $AuthenticationHeader -Uri $NewAccountCreationURI -Body $NewAccountBody -ContentType "application/json" -ErrorAction Stop
                  Write-Log "Successfully added account to CyberArk"
              }
              Catch { Write-Log "ERROR: Unable to add account to CyberArk" }

              $QueryAccountURI = "https://$BaseURI/PasswordVault/WebServices/PIMServices.svc/Accounts?Keywords=$accountAddress,$username&Safe=$safeName"

              Try {
                  $AccountDetails = Invoke-RestMethod -Method GET -Headers $AuthenticationHeader -Uri $QueryAccountURI -ContentType "application/json" -ErrorAction Stop
              }
              Catch { Write-Log "ERROR: Unable to query account" }

              $AccountID = $AccountDetails.accounts.GetValue(0) | Select -Expand AccountID
              if ($AccountID) { Write-Log "Account ID found" } else { Write-Log "Account not found" }

              $ReleaseTokenURI = "https://$BaseURI/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logoff"
              Invoke-RestMethod -Method POST -Headers $AuthenticationHeader -Uri $ReleaseTokenURI -ContentType "application/json"
          }

          function Get-CyberArkAccount {

              param (
                  [Parameter(Mandatory = $true)]
                  [string]$server,
                  [string]$username = "localadmin"
              )

              Write-Log "Requesting CyberArk password for $username on $server"

              $BaseURI     = "cyberark.yourcompany.com"
              $AppID       = "YourAppID"
              $AIMSafe     = "YourAIMSafeName"
              $AIMUsername = "YourServiceAccount"

              $AIMAuthenticationURI = "https://$BaseURI/AIMWebService/api/Accounts?AppID=$AppID&Safe=$AIMSafe&Username=$AIMUsername"

              Try {
                  $AIMToken = Invoke-RestMethod -Method GET -Uri $AIMAuthenticationURI -ErrorAction Stop
                  Write-Log "Successfully retrieved AIM credential"
              }
              Catch { Write-Log "ERROR: Unable to retrieve AIM token" }

              $RESTAuthenticationURI = "https://$BaseURI/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logon"
              $AuthenticationBody = '{"username":"' + $AIMUsername + '","password":"' + $AIMToken.Content + '"}'

              Try {
                  $RESTToken = Invoke-RestMethod -Method POST -Uri $RESTAuthenticationURI -Body $AuthenticationBody -ContentType "application/json" -ErrorAction Stop
                  Write-Log "Successfully logged in to CyberArk"
              }
              Catch { Write-Log "ERROR: Unable to log in to CyberArk" }

              $AuthenticationHeader = @{ "Authorization" = ($RESTToken.CyberArkLogonResult -join " ") }

              $QueryAccountURI = "https://$BaseURI/PasswordVault/WebServices/PIMServices.svc/Accounts?Keywords=$server,$username"

              Try {
                  $AccountDetails = Invoke-RestMethod -Method GET -Headers $AuthenticationHeader -Uri $QueryAccountURI -ContentType "application/json" -ErrorAction Stop
              }
              Catch { Write-Log "ERROR: Unable to query account" }

              $AccountID         = $AccountDetails.accounts.GetValue(0) | Select -Expand AccountID
              $AccountProperties = $AccountDetails.accounts.GetValue(0) | Select -ExpandProperty Properties

              if ($AccountID) { Write-Log "Account ID found" } else { Write-Log "Account not found" }

              $hostname, $domain = $server.Split('.')
              $domain = $domain -join '.'

              switch ($domain) {
                  "example.local"    { $acr = 'EXAMPLE' }
                  "corp.example.com" { $acr = 'CORP' }
                  "dev.example.com"  { $acr = 'DEV' }
                  "lab.internal"     { $acr = 'LAB' }
                  Default            { $acr = 'UNKNOWN' }
              }

              $platformID = "Windows-Local-$acr-NR"

              foreach ($property in $AccountProperties) {
                  switch ($property.Key) {
                      "Safe"       { $AccountSafe       = $property.Value }
                      "Folder"     { $AccountFolder     = $property.Value }
                      "Name"       { $AccountName       = $property.Value }
                      "UserName"   { $AccountUserName   = $property.Value }
                      "DeviceType" { $AccountDeviceType = $property.Value }
                      "Address"    { $AccountAddress    = $property.Value }
                  }
              }

              $GetPWDURI = "https://$BaseURI/PasswordVault/WebServices/PIMServices.svc/Accounts/$AccountID/Credentials"

              Try {
                  $AccountPassword = Invoke-RestMethod -Method GET -Headers $AuthenticationHeader -Uri $GetPWDURI -ContentType "application/json" -ErrorAction Stop
                  if ($AccountPassword) {
                      $credPassword = $AccountPassword | ConvertTo-SecureString -AsPlainText -Force
                      $global:CAcreds = New-Object System.Management.Automation.PSCredential("$hostname\$username", $credPassword)
                      Write-Log "Retrieved password"
                  }
              }
              Catch { Write-Log "ERROR: Unable to retrieve password" }

              $ReleaseTokenURI = "https://$BaseURI/PasswordVault/WebServices/auth/Cyberark/CyberArkAuthenticationService.svc/Logoff"
              Invoke-RestMethod -Method POST -Headers $AuthenticationHeader -Uri $ReleaseTokenURI -ContentType "application/json"
          }
          EOF

      - name: Create README.md
        run: |
          cat > cyberark-integration/README.md << 'EOF'
          # CyberArk Integration

          Ansible playbooks and PowerShell functions for CyberArk automation.

          ## Folder Structure

          ```
          cyberark-integration/
          ├── ansible-playbooks/
          │   ├── add-cyberark-account.yml       - Add account to CyberArk vault
          │   ├── get-cyberark-account.yml        - Get/retrieve account from vault
          │   ├── add-local-admin-cyberark.yml    - Add local admin account
          │   ├── get-domain-by-server.yml        - DNS lookup for domain name
          │   └── cyberark-login-logout.yml       - Login/logout with logging
          └── powershell/
              └── cyberark-functions.ps1          - Add-CyberArkAccount and Get-CyberArkAccount functions
          ```

          ## Prerequisites
          - CyberArk PAS / Privilege Cloud
          - AIM (Application Identity Manager) configured
          - Ansible with uri module
          - PowerShell 5.1+ (for PS functions)
          EOF

      - name: Commit and push all files
        run: |
          git add .
          git diff --cached --quiet || git commit -m "feat(cyberark): add ansible playbooks and powershell functions"
          git push origin dev
