name: Create Custom EE Files

on:
  workflow_dispatch:

jobs:
  create-custom-ee-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create folder structure
        run: |
          mkdir -p awx-tower-deployment/custom-ee/context/_build
          mkdir -p awx-tower-deployment/custom-ee/playbooks

      - name: Create requirements.yaml
        run: |
          cat > awx-tower-deployment/custom-ee/requirements.yaml << 'EOF'
          collections:
            - cisco.dnac
            - community.vmware
            - awx.awx
            - netapp.ontap
            - kubernetes.core
            - servicenow.itsm
            - servicenow.servicenow
          EOF

      - name: Create requirements.txt
        run: |
          cat > awx-tower-deployment/custom-ee/requirements.txt << 'EOF'
          ansible
          setuptools
          GitPython
          kubernetes
          EOF

      - name: Create bindep.txt
        run: |
          cat > awx-tower-deployment/custom-ee/bindep.txt << 'EOF'
          git [platform:rpm]
          sshpass
          EOF

      - name: Create execution-environment.yml
        run: |
          cat > awx-tower-deployment/custom-ee/execution-environment.yml << 'EOF'
          version: 3

          images:
            base_image:
              name: quay.io/centos/centos:stream9

          dependencies:
            ansible_core:
              package_pip: ansible-core
            ansible_runner:
              package_pip: ansible-runner
            galaxy: requirements.yaml
            python: requirements.txt
          EOF

      - name: Create custom-ee-building-command.txt
        run: |
          cat > awx-tower-deployment/custom-ee/custom-ee-building-command.txt << 'EOF'
          # Step 1: Build the Docker image
          ansible-builder build -t ansible-awx-ee:v1

          # Step 2: Tag the image for GitLab
          docker tag ansible-awx-ee:v1 registry.gitlab.com/dc_automation/ansible_awx/awx-deploy/ansible-awx-ee:v1

          # Step 3: Log in with your PAT
          docker login registry.gitlab.com -u piyushv080 -p <YOUR_PAT>

          # Step 4: Push the image to GitLab registry
          docker push registry.gitlab.com/dc_automation/ansible_awx/awx-deploy/ansible-awx-ee:v1
          EOF

      - name: Create context Dockerfile
        run: |
          cat > awx-tower-deployment/custom-ee/context/Dockerfile << 'EOF'
          ARG EE_BASE_IMAGE="quay.io/centos/centos:stream9"
          ARG PYCMD="/usr/bin/python3"
          ARG PKGMGR_PRESERVE_CACHE=""
          ARG ANSIBLE_GALAXY_CLI_COLLECTION_OPTS=""
          ARG ANSIBLE_GALAXY_CLI_ROLE_OPTS=""
          ARG ANSIBLE_INSTALL_REFS="ansible-core ansible-runner"
          ARG PKGMGR="/usr/bin/dnf"

          FROM $EE_BASE_IMAGE AS base
          USER root
          ENV PIP_BREAK_SYSTEM_PACKAGES=1
          ARG EE_BASE_IMAGE
          ARG PYCMD
          ARG PKGMGR_PRESERVE_CACHE
          ARG ANSIBLE_GALAXY_CLI_COLLECTION_OPTS
          ARG ANSIBLE_GALAXY_CLI_ROLE_OPTS
          ARG ANSIBLE_INSTALL_REFS
          ARG PKGMGR

          COPY _build/scripts/ /output/scripts/
          COPY _build/scripts/entrypoint /opt/builder/bin/entrypoint
          RUN /output/scripts/pip_install $PYCMD
          RUN $PYCMD -m pip install --no-cache-dir $ANSIBLE_INSTALL_REFS

          FROM base AS galaxy
          ARG EE_BASE_IMAGE
          ARG PYCMD
          ARG PKGMGR_PRESERVE_CACHE
          ARG ANSIBLE_GALAXY_CLI_COLLECTION_OPTS
          ARG ANSIBLE_GALAXY_CLI_ROLE_OPTS
          ARG ANSIBLE_INSTALL_REFS
          ARG PKGMGR

          RUN /output/scripts/check_galaxy
          COPY _build /build
          WORKDIR /build

          RUN mkdir -p /usr/share/ansible
          RUN ansible-galaxy role install $ANSIBLE_GALAXY_CLI_ROLE_OPTS -r requirements.yml --roles-path "/usr/share/ansible/roles"
          RUN ANSIBLE_GALAXY_DISABLE_GPG_VERIFY=1 ansible-galaxy collection install $ANSIBLE_GALAXY_CLI_COLLECTION_OPTS -r requirements.yml --collections-path "/usr/share/ansible/collections"

          FROM base AS builder
          ENV PIP_BREAK_SYSTEM_PACKAGES=1
          WORKDIR /build
          ARG EE_BASE_IMAGE
          ARG PYCMD
          ARG PKGMGR_PRESERVE_CACHE
          ARG ANSIBLE_GALAXY_CLI_COLLECTION_OPTS
          ARG ANSIBLE_GALAXY_CLI_ROLE_OPTS
          ARG ANSIBLE_INSTALL_REFS
          ARG PKGMGR

          RUN $PYCMD -m pip install --no-cache-dir bindep pyyaml packaging
          COPY --from=galaxy /usr/share/ansible /usr/share/ansible
          COPY _build/requirements.txt requirements.txt
          RUN $PYCMD /output/scripts/introspect.py introspect --user-pip=requirements.txt --write-bindep=/tmp/src/bindep.txt --write-pip=/tmp/src/requirements.txt
          RUN /output/scripts/assemble

          FROM base AS final
          ENV PIP_BREAK_SYSTEM_PACKAGES=1
          ARG EE_BASE_IMAGE
          ARG PYCMD
          ARG PKGMGR_PRESERVE_CACHE
          ARG ANSIBLE_GALAXY_CLI_COLLECTION_OPTS
          ARG ANSIBLE_GALAXY_CLI_ROLE_OPTS
          ARG ANSIBLE_INSTALL_REFS
          ARG PKGMGR

          RUN /output/scripts/check_ansible $PYCMD
          COPY --from=galaxy /usr/share/ansible /usr/share/ansible
          COPY --from=builder /output/ /output/
          RUN /output/scripts/install-from-bindep && rm -rf /output/wheels
          RUN chmod ug+rw /etc/passwd
          RUN mkdir -p /runner && chgrp 0 /runner && chmod -R ug+rwx /runner
          WORKDIR /runner
          RUN $PYCMD -m pip install --no-cache-dir 'dumb-init==1.2.5'
          RUN rm -rf /output
          LABEL ansible-execution-environment=true
          USER 1000
          ENTRYPOINT ["/opt/builder/bin/entrypoint", "dumb-init"]
          CMD ["bash"]
          EOF

      - name: Create GitHub Actions build workflow
        run: |
          mkdir -p awx-tower-deployment/custom-ee/.github/workflows
          cat > awx-tower-deployment/custom-ee/.github/workflows/build-custom-ee.yml << 'EOF'
          name: Build and Push Custom Execution Environment

          on:
            push:
              branches:
                - dev
            workflow_dispatch:

          jobs:
            build-and-push:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Install ansible-builder
                  run: |
                    python3 -m venv /venv
                    source /venv/bin/activate
                    pip install --upgrade pip
                    pip install ansible-builder ansible-core ansible-runner

                - name: Build Execution Environment
                  run: |
                    source /venv/bin/activate
                    cd awx-tower-deployment/custom-ee
                    ansible-builder build -t ansible-awx-ee:v1

                - name: Login to Registry
                  run: |
                    echo "${{ secrets.CI_REGISTRY_PASSWORD }}" | docker login \
                      -u "${{ secrets.CI_REGISTRY_USER }}" \
                      --password-stdin "${{ secrets.CI_REGISTRY }}"

                - name: Tag and Push Image
                  run: |
                    docker tag ansible-awx-ee:v1 ${{ secrets.CI_REGISTRY }}:v1
                    docker push ${{ secrets.CI_REGISTRY }}:v1
          EOF

      - name: Commit and push all files
        run: |
          git add .
          git diff --cached --quiet || git commit -m "feat(custom-ee): add custom execution environment files"
          git push origin dev
