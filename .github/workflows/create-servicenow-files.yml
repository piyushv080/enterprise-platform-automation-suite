name: Create ServiceNow Integration Files

on:
  workflow_dispatch:

jobs:
  create-servicenow-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create folder structure
        run: |
          mkdir -p servicenow-integration/playbooks
          mkdir -p servicenow-integration/tasks

      - name: Create add-ci-to-snow.yml
        run: |
          cat > servicenow-integration/playbooks/add-ci-to-snow.yml << 'EOF'
          #!/usr/bin/env ansible-playbook
          ---
          - hosts: all
            become: true
            gather_facts: true
            serial: 1
            tasks:
              - name: Create CI in SNOW
                import_tasks: tasks/add_ci_to_snowscripts
          EOF

      - name: Create create-ci.yml
        run: |
          cat > servicenow-integration/playbooks/create-ci.yml << 'EOF'
          #!/usr/bin/env ansible-playbook
          ---
          - hosts: all
            become: true
            gather_facts: true
            serial: 1

            tasks:
              - name: Create CI in SNOW
                import_tasks: tasks/create_ci.yaml
          EOF

      - name: Create debug-facts.yml
        run: |
          cat > servicenow-integration/playbooks/debug-facts.yml << 'EOF'
          #!/usr/bin/env ansible-playbook
          ---
          - hosts: all
            become: true

            tasks:
              - debug:
                  msg: "FQDN: {{ facter_networking.fqdn }}"

              - debug:
                  msg: "IP: {{ ansible_default_ipv4.address }}"

              - debug:
                  msg: "MAC: {{ ansible_default_ipv4.macaddress }}"

              - debug:
                  msg: "Product: {{ facter_dmi.product.name }}, {{ facter_dmi.product.serial_number }}"
          EOF

      - name: Create retrieve-cmdb-items.yml
        run: |
          cat > servicenow-integration/playbooks/retrieve-cmdb-items.yml << 'EOF'
          ---
          - name: Retrieve all configuration items from ServiceNow
            hosts: localhost
            gather_facts: false

            tasks:
              - name: Retrieve all configuration items
                uri:
                  url: "https://{{ snow_host }}/api/now/table/cmdb_ci"
                  method: GET
                  user: "{{ snow_username }}"
                  password: "{{ snow_password }}"
                  headers:
                    Accept: "application/json"
                register: cmdb_items_response

              - name: Print all configuration items
                ansible.builtin.debug:
                  var: cmdb_items_response.json
          EOF

      - name: Create cmdb-item-info.yml
        run: |
          cat > servicenow-integration/playbooks/cmdb-item-info.yml << 'EOF'
          ---
          - name: Demonstrate CMDB item info retrieval
            hosts: localhost
            gather_facts: false

            tasks:
              - name: Define incident variable
                ansible.builtin.set_fact:
                  incident:
                    record:
                      cmdb_ci: "YOUR_CMDB_SYS_ID_HERE"

              - name: Retrieve information about CMDB item
                servicenow.itsm.configuration_item_info:
                  sys_id: "{{ incident.record.cmdb_ci }}"
                register: cmdb_info

              - name: Print CMDB item name
                ansible.builtin.debug:
                  var: cmdb_info.records[0].name
          EOF

      - name: Create test-snow-connectivity.yml
        run: |
          cat > servicenow-integration/playbooks/test-snow-connectivity.yml << 'EOF'
          ---
          - name: Test ServiceNow connectivity
            hosts: localhost
            gather_facts: false

            tasks:
              - name: Test connectivity
                uri:
                  url: "https://{{ snow_host }}/api/now/table/cmdb_ci"
                  method: GET
                  user: "{{ snow_username }}"
                  password: "{{ snow_password }}"
                  headers:
                    Accept: "application/json"
                register: response

              - name: Print response
                ansible.builtin.debug:
                  var: response
          EOF

      - name: Create env-setup.sh
        run: |
          cat > servicenow-integration/env-setup.sh << 'EOF'
          #!/bin/bash
          # ServiceNow environment variables
          # Replace with your actual values before running

          export SN_HOST=https://your-instance.service-now.com
          export SN_USERNAME=your_username
          export SN_PASSWORD=your_password
          EOF

      - name: Create README.md
        run: |
          cat > servicenow-integration/README.md << 'EOF'
          # ServiceNow Integration

          Ansible playbooks for ServiceNow CMDB and CI automation.

          ## Folder Structure

          ```
          servicenow-integration/
          ├── playbooks/
          │   ├── add-ci-to-snow.yml          - Add CI to ServiceNow
          │   ├── create-ci.yml               - Create CI via task import
          │   ├── debug-facts.yml             - Debug host facts (FQDN, IP, MAC, Serial)
          │   ├── retrieve-cmdb-items.yml     - Retrieve all CMDB items
          │   ├── cmdb-item-info.yml          - Get specific CMDB item info
          │   └── test-snow-connectivity.yml  - Test ServiceNow API connectivity
          ├── tasks/                          - Reusable task files
          └── env-setup.sh                   - Environment variable setup
          ```

          ## Environment Variables Required

          | Variable       | Description                        |
          |----------------|------------------------------------|
          | SN_HOST        | ServiceNow instance URL            |
          | SN_USERNAME    | ServiceNow admin username          |
          | SN_PASSWORD    | ServiceNow admin password          |

          ## Setup

          source env-setup.sh

          ## Prerequisites
          - Ansible with servicenow.itsm collection installed
          - ServiceNow developer or production instance access
          EOF

      - name: Commit and push all files
        run: |
          git add .
          git diff --cached --quiet || git commit -m "feat(servicenow): add CMDB and CI integration playbooks"
          git push origin dev
