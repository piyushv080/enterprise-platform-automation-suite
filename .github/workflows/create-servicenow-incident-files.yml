name: Create ServiceNow Incident and CI Files

on:
  workflow_dispatch:

jobs:
  create-servicenow-incident-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create folder structure
        run: |
          mkdir -p servicenow-integration/playbooks
          mkdir -p servicenow-integration/tasks
          mkdir -p servicenow-integration/vars

      - name: Create incident-lifecycle.yml
        run: |
          cat > servicenow-integration/playbooks/incident-lifecycle.yml << 'EOF'
          ---
          - name: Create incident in ServiceNow
            hosts: localhost
            connection: local
            gather_facts: false

            tasks:
              - name: Create incident
                servicenow.itsm.incident:
                  state: new
                  short_description: "Really important incident"
                  description: "Something really important is broken"
                  other:
                    commits: "This could take all day to fix!"
                    cmdb_ci: server2.example.com
                  impact: high
                  urgency: high
                delegate_to: localhost
                register: incident_info

              - name: Get incident information
                servicenow.itsm.incident_info:
                  number: "{{ incident_info.record.number }}"
                register: incident_details

              - name: Print incident details
                debug:
                  msg: "{{ incident_details }}"

              - pause:

              - name: Update incident to in_progress
                servicenow.itsm.incident:
                  number: "{{ incident_info.record.number }}"
                  state: in_progress
                  other:
                    comments: "Working hard. Lots of troubleshooting!"

              - pause:

              - name: Close the incident
                servicenow.itsm.incident:
                  number: "{{ incident_info.record.number }}"
                  state: closed
                  close_code: "Solved (Permanently)"
                  close_notes: "Only I know how to fix this. You wouldn't understand"
                  other:
                    comments: "Phew! What a day. Might need tomorrow off to recover."
          EOF

      - name: Create append-linux-server.yml
        run: |
          cat > servicenow-integration/playbooks/append-linux-server.yml << 'EOF'
          #!/usr/bin/env ansible-playbook
          ---
          - name: Add newly deployed CI entry to file
            hosts: all
            become: yes

            tasks:
              - name: Append hostname entry
                lineinfile:
                  path: /opt/scripts/snow/linux_servers
                  insertafter: EOF
                  line: "{{ test_hostname }}"
                  state: present
                when: ansible_distribution == "RedHat"
                delegate_to: test-delegate.example.com
          EOF

      - name: Create create-ci-task.yml (task file)
        run: |
          cat > servicenow-integration/tasks/create-ci-task.yml << 'EOF'
          ---
          - name: Load ServiceNow variables
            include_vars: ../vars/create_ci.yaml

          - name: Create CI record
            servicenow:
              password: "{{ test_pass }}"
              hostname: "{{ ansible_hostname }}"
              operating_system: "{{ ansible_distribution }}"
              manufacturer: "{{ test_manufacturer }}"
              used_for: "{{ test_usage }}"
              serial_number: "{{ test_serial }}"
              model_id: "{{ ansible_product_name }}"
              owned_by: "Test Owner"
              managed_by: "Test Manager"
              supported_by: "Test Support"
              comments: "{{ test_comments | default('') }}"
              fqdn: "{{ test_fqdn }}"
              mac_address: "{{ ansible_default_ipv4.macaddress }}"
              os_domain: "{{ ansible_domain }}"
              os_version: "{{ ansible_distribution_major_version }}"
              virtual: "{{ test_virtual }}"
              proxy_host: "proxy.example.com"
              proxy_port: 8080
              headless: "{{ test_headless | default(True) | bool }}"
            register: snow
            delegate_to: localhost
            become: false

          - debug:
              var: snow.msg
              verbosity: 1
          EOF

      - name: Create test-ci-creation.yml
        run: |
          cat > servicenow-integration/playbooks/test-ci-creation.yml << 'EOF'
          #!/usr/bin/env ansible-playbook
          ---
          - hosts: localhost
            become: false
            gather_facts: false

            tasks:
              - name: Create test CI entry
                servicenow:
                  username: "{{ lookup('env', 'TEST_USER') }}"
                  password: "{{ test_pass }}"
                  hostname: "test-ci01"
                  manufacturer: "Test Manufacturer"
                  location: "Test Location"
                  used_for: "Testing"
                  serial_number: "test-ci01-serial"
                  model_id: "Test Virtual Platform"
                  owned_by: "Test Owner"
                  managed_by: "Test Manager"
                  supported_by: "Test Support"
                  short_description: "Automated test description"
                  comments: "Automated test comments"
                  fqdn: "test-ci01.example.com"
                  mac_address: "00:00:00:00:00:00"
                  os_domain: "example.local"
                  os_version: "1"
                  virtual: true
                  headless: true
                register: snow
                delegate_to: test-delegate.example.com
                vars:
                  ansible_python_interpreter: "/opt/testenv/bin/python"
                environment:
                  DISPLAY: "localhost:12.0"

              - debug:
                  var: snow
          EOF

      - name: Create vars/create_ci.yaml
        run: |
          cat > servicenow-integration/vars/create_ci.yaml << 'EOF'
          ---
          # ServiceNow CI Variables
          # Replace all values with your real environment values

          test_pass: "{{ lookup('env', 'SN_PASSWORD') }}"
          test_hostname: "your-server-hostname"
          test_manufacturer: "Your Manufacturer"
          test_usage: "Production"
          test_serial: "your-serial-number"
          test_fqdn: "your-server.example.com"
          test_virtual: false
          test_headless: true
          test_comments: "Deployed via Ansible automation"
          EOF

      - name: Update README.md
        run: |
          cat > servicenow-integration/README.md << 'EOF'
          # ServiceNow Integration

          Ansible playbooks for ServiceNow CMDB, CI, and Incident automation.

          ## Folder Structure

          ```
          servicenow-integration/
          ├── playbooks/
          │   ├── add-ci-to-snow.yml          - Add CI to ServiceNow
          │   ├── create-ci.yml               - Create CI via task import
          │   ├── debug-facts.yml             - Debug host facts (FQDN, IP, MAC, Serial)
          │   ├── retrieve-cmdb-items.yml     - Retrieve all CMDB items
          │   ├── cmdb-item-info.yml          - Get specific CMDB item info
          │   ├── test-snow-connectivity.yml  - Test ServiceNow API connectivity
          │   ├── incident-lifecycle.yml      - Full incident lifecycle (create, update, close)
          │   ├── append-linux-server.yml     - Append new server to CI file
          │   └── test-ci-creation.yml        - Test CI creation playbook
          ├── tasks/
          │   └── create-ci-task.yml          - Reusable CI creation task
          └── vars/
              └── create_ci.yaml              - Variable definitions for CI creation
          ```

          ## Environment Variables Required

          | Variable     | Description                    |
          |--------------|--------------------------------|
          | SN_HOST      | ServiceNow instance URL        |
          | SN_USERNAME  | ServiceNow admin username      |
          | SN_PASSWORD  | ServiceNow admin password      |
          | TEST_USER    | Test user for CI creation      |

          ## Prerequisites
          - Ansible with `servicenow.itsm` collection installed
          - ServiceNow developer or production instance access
          EOF

      - name: Commit and push all files
        run: |
          git add .
          git diff --cached --quiet || git commit -m "feat(servicenow): add incident lifecycle, CI creation and task files"
          git push origin dev
