name: Cleanup Version Folders

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove all version folders
        run: |
          find . -type d -name "v1.0" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "v2.0" -exec rm -rf {} + 2>/dev/null || true

      - name: Commit and push
        run: |
          git add .
          git diff --cached --quiet || git commit -m "chore: remove all version subfolders from dev"
          git push origin dev
