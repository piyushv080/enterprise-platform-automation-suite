name: Create AWX Tower Deployment Files

on:
  workflow_dispatch:

jobs:
  create-awx-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create awx-demo.yaml
        run: |
          cat > awx-tower-deployment/awx-demo.yaml << 'EOF'
          ---
          apiVersion: awx.ansible.com/v1beta1
          kind: AWX
          metadata:
            name: awx-demo
          spec:
            service_type: nodeport
            nodeport_port: 32000
          EOF

      - name: Create kustomization.yaml
        run: |
          cat > awx-tower-deployment/kustomization.yaml << 'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - github.com/ansible/awx-operator/config/default?ref=2.19.1
            - awx-demo.yaml
          images:
            - name: quay.io/ansible/awx-operator
              newTag: 2.19.1
          namespace: awx
          EOF

      - name: Create build-and-test-ee.yml (GitHub Actions)
        run: |
          mkdir -p awx-tower-deployment/.github/workflows
          cat > awx-tower-deployment/.github/workflows/build-and-test-ee.yml << 'EOF'
          name: Build and Test AWX Execution Environment

          on:
            push:
              branches:
                - dev
            workflow_dispatch:

          jobs:
            build-and-push-ee-image:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Login to Container Registry
                  run: |
                    echo "${{ secrets.CI_REGISTRY_PASSWORD }}" | docker login \
                      -u "${{ secrets.CI_REGISTRY_USER }}" \
                      --password-stdin "${{ secrets.CI_REGISTRY }}"

                - name: Install ansible-builder
                  run: |
                    python3 -m venv /venv
                    source /venv/bin/activate
                    pip install --upgrade pip
                    pip install ansible-builder ansible-core ansible-runner

                - name: Build Execution Environment
                  run: |
                    source /venv/bin/activate
                    cd ansible-ee
                    ansible-builder build -t awx-terraform-ee:v1 --container-runtime docker

                - name: Tag and Push Image
                  run: |
                    docker tag awx-terraform-ee:v1 ${{ secrets.CI_REGISTRY }}:v1
                    docker push ${{ secrets.CI_REGISTRY }}:v1

            test-ee-image:
              runs-on: ubuntu-latest
              needs: build-and-push-ee-image

              steps:
                - name: Checkout code
                  uses: actions/checkout@v4

                - name: Login to Container Registry
                  run: |
                    echo "${{ secrets.CI_REGISTRY_PASSWORD }}" | docker login \
                      -u "${{ secrets.CI_REGISTRY_USER }}" \
                      --password-stdin "${{ secrets.CI_REGISTRY }}"

                - name: Pull and Test EE Image
                  run: |
                    docker pull ${{ secrets.CI_REGISTRY }}:v1
                    docker run --rm -v "$PWD:/workspace" ${{ secrets.CI_REGISTRY }}:v1 \
                      ansible-playbook /workspace/ansible-ee/playbooks/check_versions.yml
          EOF

      - name: Create deployment-guide.md
        run: |
          cat > awx-tower-deployment/deployment-guide.md << 'EOF'
          # AWX Deployment on Rancher K3s (Without Docker Licensing)

          ## 1. Update Your System
          sudo apt update
          sudo apt upgrade -y

          ## 2. Install k3s
          curl -sfL https://get.k3s.io | sh -

          ## 3. Give Non-root User Access to K3s Config
          sudo chown $USER:$USER /etc/rancher/k3s/k3s.yaml
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          ## 4. Verify Kubernetes Cluster
          kubectl version
          kubectl get nodes
          kubectl get pods -A

          ## 5. Install Kustomize
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin

          ## 6. Create Kustomization Directory
          mkdir awx-deploy && cd awx-deploy

          ## 7. Create kustomization.yaml
          nano kustomization.yaml

          ## 8. Apply Kustomize Configuration
          kubectl apply -k .

          ## 9. Verify Operator is Running
          kubectl get pods -n awx

          ## 10. Create AWX Instance
          nano awx-demo.yaml

          ## 11. Add Instance to Kustomization
          nano kustomization.yaml

          ## 12. Reapply Kustomize Configuration
          kubectl apply -k .

          ## 13. Check POD Status
          kubectl get pods -n awx

          ## 14. View Logs
          kubectl logs -f deployment/awx-operator-controller-manager -c awx-manager -n awx

          ## 15. Retrieve Admin Password
          kubectl get secret awx-demo-admin-password -n awx -o jsonpath="{.data.password}" | base64 --decode ; echo

          ## 16. Access the AWX Dashboard
          http://<your-server-ip>:32000
          Username: admin
          Password: (from previous step)

          ## References
          - https://blog.kurokobo.com/archives/category/it/ansible
          - https://www.server-world.info/en/note?os=CentOS_Stream_9&p=ansible&f=9
          EOF

      - name: Commit and push all files
        run: |
          git add .
          git diff --cached --quiet || git commit -m "feat(awx): add deployment files - kustomization, awx-demo, github-actions, deployment guide"
          git push origin dev
