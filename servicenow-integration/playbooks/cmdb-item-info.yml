---
- name: Demonstrate CMDB item info retrieval
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Define incident variable
      ansible.builtin.set_fact:
        incident:
          record:
            cmdb_ci: "YOUR_CMDB_SYS_ID_HERE"

    - name: Retrieve information about CMDB item
      servicenow.itsm.configuration_item_info:
        sys_id: "{{ incident.record.cmdb_ci }}"
      register: cmdb_info

    - name: Print CMDB item name
      ansible.builtin.debug:
        var: cmdb_info.records[0].name
